name: Update HP Government Jobs

on:
  schedule:
    - cron: "15 2 * * *"

  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-hp-government-jobs
  cancel-in-progress: false

jobs:
  update-jobs:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y tesseract-ocr poppler-utils

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfplumber pytesseract pillow

      - name: Verify dependencies
        run: |
          python -c "import requests, bs4, pdfplumber, pytesseract; print('Python dependencies OK')"
          tesseract --version

      - name: Check HPPSC DNS
        continue-on-error: true
        run: |
          python -c "import socket; print(socket.gethostbyname_ex('hppsc.hp.gov.in'))"

      - name: Check alternate DNS
        continue-on-error: true
        run: |
          python - <<'PY'
          import requests

          url = "https://cloudflare-dns.com/dns-query"

          try:
              response = requests.get(
                  url,
                  params={
                      "name": "hppsc.hp.gov.in",
                      "type": "A"
                  },
                  headers={
                      "accept": "application/dns-json"
                  },
                  timeout=20
              )

              print("DNS status:", response.status_code)
              print(response.text)

          except Exception as error:
              print("Alternate DNS check failed:", repr(error))
          PY

      - name: Run jobs scanner
        run: |
          python scripts/auto_update_hppsc.py

      - name: Validate generated files
        run: |
          python - <<'PY'
          import json
          from pathlib import Path

          required = [
              Path("data/jobs.json"),
              Path("data/jobs_preview.json"),
              Path("data/jobs_review.json"),
              Path("jobs.js")
          ]

          for path in required:
              if not path.exists():
                  raise SystemExit(f"Missing required file: {path}")

              print(f"Found: {path}")

          for path in required[:3]:
              with path.open(encoding="utf-8") as file:
                  json.load(file)

              print(f"Valid JSON: {path}")

          content = Path("jobs.js").read_text(encoding="utf-8")

          if not content.startswith("const JOBS = "):
              raise SystemExit("jobs.js does not contain expected JOBS declaration")

          print("Generated files validated.")
          PY

      - name: Commit updated jobs data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add jobs.js
          git add data/jobs.json
          git add data/jobs_preview.json
          git add data/jobs_review.json

          if git diff --cached --quiet; then
            echo "No changes to commit."
          else
            git commit -m "Update HP government jobs data"
            git push
          fi
