
name: Update HPPSC Jobs

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfplumber

      - name: Test Standard DNS
        continue-on-error: true
        run: |
          python -c "import socket; print(socket.gethostbyname_ex('hppsc.hp.gov.in'))"

      - name: Test HPPSC Alternate DNS
        run: |
          python - <<'PY'
          import requests

          url = "https://cloudflare-dns.com/dns-query"
          params = {
              "name": "hppsc.hp.gov.in",
              "type": "A"
          }
          headers = {
              "accept": "application/dns-json"
          }

          try:
              response = requests.get(
                  url,
                  params=params,
                  headers=headers,
                  timeout=20
              )

              print("DNS response status:", response.status_code)
              print(response.text)

              response.raise_for_status()

              data = response.json()

              if data.get("Answer"):
                  print("Alternate DNS lookup successful")
              else:
                  print("No DNS A records returned")

          except Exception as e:
              print("Alternate DNS test failed:", repr(e))
              raise
          PY

      - name: Test HPPSC HTTPS
        continue-on-error: true
        run: |
          python -c "import requests; print(requests.get('https://hppsc.hp.gov.in/', timeout=20).status_code)"

      - name: Fetch HPPSC advertisements
        run: python scripts/fetch_jobs.py

      - name: Check generated jobs file
        run: |
          if [ -f data/jobs.json ]; then
            echo "jobs.json exists"
            cat data/jobs.json
          else
            echo "ERROR: data/jobs.json was not generated"
            exit 1
          fi

      - name: Save updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/jobs.json

          if git diff --cached --quiet; then
            echo "No changes in jobs data"
          else
            git commit -m "Update HPPSC jobs"
            git push
          fi
