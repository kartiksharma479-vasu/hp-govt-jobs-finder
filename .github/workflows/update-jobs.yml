
name: Update HPPSC Jobs

on:
  schedule:
    - cron: "15 2 * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update-jobs:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4 pdfplumber

      - name: Test HPPSC DNS
        run: |
          python -c "import socket; print(socket.gethostbyname_ex('hppsc.hp.gov.in'))"

      - name: Fetch HPPSC advertisements
        run: python scripts/fetch_jobs.py

      - name: Check generated jobs file
        run: |
          if [ -f data/jobs.json ]; then
            echo "jobs.json exists"
            cat data/jobs.json
          else
            echo "ERROR: data/jobs.json was not generated"
            exit 1
          fi

      - name: Save updated jobs
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add data/jobs.json

          if git diff --cached --quiet; then
            echo "No changes in jobs data"
          else
            git commit -m "Update HPPSC jobs"
            git push
          fi
